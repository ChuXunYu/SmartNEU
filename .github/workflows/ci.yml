name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: 文档与仓库卫生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否提交了凭据或构建产物
        shell: bash
        run: |
          set -e
          bad=0
          if git ls-files | grep -E '(^|/)(state\.json|.*\.keystore|.*\.jks|.*\.pem|.*\.apk|.*\.idsig)$'; then
            echo "::error::仓库中不应包含状态文件、密钥或构建产物"
            bad=1
          fi
          if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!neu-lite/neulite/crypto.py' ':!THIRD_PARTY_NOTICES.md'; then
            echo "::error::检测到疑似私钥内容"
            bad=1
          fi
          exit $bad
      - name: 检查 Web UI 双目录是否同步
        shell: bash
        run: |
          set -e
          for f in app.js index.html style.css qrcode.js; do
            if ! cmp -s "neu-lite/web/$f" "neu-lite-android/assets/$f"; then
              echo "::error::neu-lite/web/$f 与 neu-lite-android/assets/$f 不一致"
              exit 1
            fi
          done
      - name: Python 语法检查
        run: python -m compileall -q neu-lite

  python-selftest:
    name: Python 自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r neu-lite/requirements.txt
      - run: python run.py selftest
        working-directory: neu-lite

  android-build:
    name: Android 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件
        shell: pwsh
        run: |
          $sdk = "$env:ANDROID_HOME"
          & "$sdk\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"
      - name: 构建 APK
        shell: pwsh
        run: |
          (Get-Content neu-lite-android/build.ps1) -replace "\$sdk = '.*'", "\$sdk = `"$env:ANDROID_HOME`"" | Set-Content neu-lite-android/build.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File neu-lite-android/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: neu-lite-android/日在NEU.apk
          if-no-files-found: error
