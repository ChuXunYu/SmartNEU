<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2">
<meta name="color-scheme" content="light dark">
<title>智慧东大 · 轻量版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="loginview hidden">
  <div class="loginbox">
    <div class="seal seal-lg">東</div>
    <h1>智慧东大</h1>
    <p class="loginsub">NEU · 课程 考试 成绩 网费</p>

    <div id="savedLogin" class="savedlogin hidden">
      <div class="saved-tag">本机已保存账号</div>
      <div class="saved-user">
        <b id="savedName">已保存账号</b>
        <span id="savedId"></span>
      </div>
      <button id="btnQuickLogin" class="btn-primary">一键登录</button>
      <button id="btnSwitchAccount" class="btn-switch">使用其他账号</button>
    </div>

    <div id="manualLogin">
      <label class="flabel" for="username">学号</label>
      <div class="field">
        <input id="username" autocomplete="username" inputmode="numeric" placeholder="2024xxxx">
      </div>

      <label class="flabel" for="password">密码</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" placeholder="统一身份认证密码">
        <button id="togglePwd" class="eye" type="button">显示</button>
      </div>

      <label class="check"><input type="checkbox" id="remember" checked> 记住账号密码</label>
      <button id="btnLogin" class="btn-primary">登 录</button>
    </div>

    <div id="smsBox" class="smsbox hidden">
      <p class="warn">需要短信二次验证</p>
      <label class="flabel" for="smsCode">验证码</label>
      <div class="field"><input id="smsCode" inputmode="numeric" placeholder="6 位数字"></div>
      <label class="check"><input type="checkbox" id="trustDevice"> 信任本设备</label>
      <div class="row">
        <button id="btnSendSms" class="btn-ghost">发送验证码</button>
        <button id="btnVerify" class="btn-primary">提交</button>
      </div>
    </div>
    <p id="loginMsg" class="msg"></p>
    <p id="loginHint" class="login-hint">登录一次后，导出 state.json 带到新设备可免二次验证</p>
  </div>
</div>

<!-- 主体 -->
<div id="appView" class="app hidden">
  <header class="masthead">
    <div class="topline">
      <div class="brand">
        <span class="seal">東</span>
        <div>
          <div class="brand-name">智慧东大</div>
          <div class="brand-sub">NEU · LITE</div>
        </div>
      </div>
      <div class="hero-actions">
        <button id="btnMore" class="linkbtn">更多</button>
        <button id="btnLogout" class="avatar" title="退出登录">我</button>
      </div>
    </div>

    <div class="hello">
      <div id="todayLabel" class="kicker">二〇二六年 十月</div>
      <h1 id="greet">你好</h1>
      <div id="who" class="who"></div>
    </div>

    <div class="ledger" id="ledger">
      <div class="cell"><b id="st1">—</b><span id="sl1">本周课程</span></div>
      <div class="cell"><b id="st2">—</b><span id="sl2">今日课程</span></div>
      <div class="cell"><b id="st3">—</b><span id="sl3">有课天数</span></div>
    </div>
    <div id="updatedAt" class="updated"></div>
  </header>

  <main>
    <!-- 课表 -->
    <section id="panel-schedule" class="panel">
      <div class="section-head">
        <h3><i>01</i>课表</h3>
        <div class="actions">
          <div class="seg" id="viewToggle">
            <button data-view="day" class="on">日</button>
            <button data-view="week">周</button>
          </div>
          <button id="btnExportKb" class="textbtn">导出课表</button>
        </div>
      </div>
      <div class="weekcard">
        <div class="weeknav">
          <button id="prevWeek" class="navbtn" aria-label="上一周">←</button>
          <div class="weeklabel">
            <div id="weekTitle">第 1 周</div>
            <div id="weekRange" class="sub"></div>
          </div>
          <button id="nextWeek" class="navbtn" aria-label="下一周">→</button>
        </div>
        <div id="dayStrip" class="daystrip"></div>
      </div>
      <div class="dayhead"><h3 id="dayTitle">今日课程</h3></div>
      <div id="timeline" class="timeline"></div>
    </section>

    <!-- 考试 -->
    <section id="panel-exams" class="panel hidden">
      <div class="section-head">
        <h3><i>02</i>考试</h3>
        <div class="actions">
          <button id="btnExportExams" class="textbtn">导出 CSV</button>
          <button id="probeJwxt" class="textbtn">刷新</button>
        </div>
      </div>
      <p id="examNote" class="sub note"></p>
      <div id="examList" class="examlist"></div>
    </section>

    <!-- 成绩 -->
    <section id="panel-grades" class="panel hidden">
      <div class="section-head">
        <h3><i>03</i>成绩</h3>
        <span id="gradeCount" class="sub"></span>
      </div>
      <div id="gpaHero"></div>
      <div id="gradeList" class="gradelist"></div>
    </section>

    <!-- 网费 -->
    <section id="panel-net" class="panel hidden">
      <div class="section-head"><h3><i>04</i>网费</h3></div>
      <div id="netCards" class="netcards"></div>
      <div id="netPlan" class="netplan"></div>
      <div id="netLinksHead" class="section-head subhead"><h3><i>附</i>自助服务</h3></div>
      <div id="netLinks" class="links"></div>
      <p id="netNote" class="sub note"></p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="schedule"><i>01</i><span>课表</span></button>
    <button class="tab" data-tab="exams"><i>02</i><span>考试</span></button>
    <button class="tab" data-tab="grades"><i>03</i><span>成绩</span></button>
    <button class="tab" data-tab="net"><i>04</i><span>网费</span></button>
  </nav>
</div>

<div id="sheetMask" class="sheetmask hidden">
  <div class="sheet">
    <div class="sheet-title">更多</div>
    <a id="linkJwxt" class="sheet-item" href="/sso?target=jwxt" target="_blank" rel="noreferrer"><span>打开教务（免登）</span><i>↗</i></a>
    <button id="btnRefresh" class="sheet-item"><span>刷新数据</span><i>↻</i></button>
    <button id="btnExport" class="sheet-item"><span>导出状态文件</span><i>↗</i></button>
    <button id="btnImport" class="sheet-item hidden"><span>导入状态文件</span><i>↙</i></button>
    <button id="btnLogout2" class="sheet-item danger"><span>退出登录</span><i>⎋</i></button>
    <div id="imei" class="sheet-foot sub"></div>
  </div>
</div>

<div id="progress" class="progress hidden"><i></i></div>
<div id="updateChip" class="updatechip hidden"><span class="spin"></span><span id="updateText">正在更新…</span></div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
