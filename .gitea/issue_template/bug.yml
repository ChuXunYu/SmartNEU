name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿在 Issue 中粘贴学号、密码、TGT、Cookie、SMTP 专用密码或校园乐跑 token。
        请先阅读 docs/TROUBLESHOOTING.md。
  - type: input
    id: version
    attributes:
      label: 版本
      description: APK 版本 / 提交号，例如 0.4.1 / 4a22aab
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备
      description: 机型、Android 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附截图，但请先打码个人信息
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 错误提示、发生时间；不要贴完整凭据
    validations:
      required: false
